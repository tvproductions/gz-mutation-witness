[project]
name = "gz-mutation-witness"
version = "0.3.1"
description = "Mutation-sweep witness for unittest suites: killed, survived, invalid, inconclusive"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "g0" }]
dependencies = ["pydantic>=2.14.1"]

[project.urls]
Repository = "https://github.com/tvproductions/gz-mutation-witness"

[build-system]
requires = ["uv_build==0.13.9"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.5"
python-preference = "only-managed"

[tool.uv.build-backend]
module-name = "gz_mutation_witness"

[dependency-groups]
dev = [
    "gz-starter[verification] @ git+https://github.com/tvproductions/gz-starter.git@7303deff043231d8bcbb789e52efdbdde6b7e2f0",
    "ruff==0.17.6",
    "ty==0.0.107",
    "pre-commit==4.7.0",
]
hygiene = [
    "cohesion==1.2.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests"]
